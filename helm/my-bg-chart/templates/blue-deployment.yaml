{{- if .Values.blue.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-app-blue
  labels:
    app: spring-app
    color: blue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spring-app
      color: blue
  template:
    metadata:
      labels:
        app: spring-app
        color: blue
    spec:
      containers:
        - name: spring-app
          image: "{{ .Values.repository }}:{{ .Values.blue.tag }}"
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: APP_VERSION
              value: "{{ .Values.blue.versionLabel }}"
            - name: APP_COLOR
              value: "blue"
{{- end }}