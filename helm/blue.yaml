apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-app-blue
  labels:
    app: spring-app
    color: blue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spring-app
      color: blue
  template:
    metadata:
      labels:
        app: spring-app
        color: blue
    spec:
      containers:
        - name: spring-app
          # This is YOUR image from the logs
          image: 762102778335.dkr.ecr.us-east-1.amazonaws.com/blue-green-demo:v1
          ports:
            - containerPort: 8080
          env:
            - name: APP_VERSION
              value: "v1"
            - name: APP_COLOR
              value: "blue"